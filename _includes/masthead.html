{% include base_path %}
{% assign is_chinese = false %}
{% if page.lang == "zh-CN" %}{% assign is_chinese = true %}{% endif %}
<div class="masthead">
  <div class="masthead__inner-wrap">
    <div class="masthead__menu">
      <nav id="site-nav" class="greedy-nav" aria-label="{% if is_chinese %}主导航{% else %}Primary navigation{% endif %}">
        <button aria-label="{% if is_chinese %}展开导航{% else %}Open navigation{% endif %}"><span class="navicon"></span></button>
        <ul class="visible-links">
          <li class="masthead__menu-item masthead__menu-item--lg persist selected">
            <a href="{{ base_path }}{% if is_chinese %}/zh/{% else %}/{% endif %}">{{ site.title }}</a>
          </li>
          <li class="masthead__menu-item language-switch persist tail" aria-label="Language">
            <a href="{{ base_path }}/" lang="en" hreflang="en"{% unless is_chinese %} class="is-active" aria-current="page"{% endunless %}>EN</a>
            <span aria-hidden="true">/</span>
            <a href="{{ base_path }}/zh/" lang="zh-CN" hreflang="zh-CN"{% if is_chinese %} class="is-active" aria-current="page"{% endif %}>中文</a>
          </li>
          <li id="theme-toggle" class="masthead__menu-item persist tail">
            <a role="button" aria-label="{% if is_chinese %}切换明暗主题{% else %}Toggle color theme{% endif %}"><i id="theme-icon" class="fa-solid fa-sun" aria-hidden="true"></i></a>
          </li>
        </ul>
        <ul class="hidden-links hidden"></ul>
      </nav>
    </div>
  </div>
</div>
