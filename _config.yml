# Site identity
locale: "en-US"
site_theme: "default"
title: "Yitian Jin"
title_separator: "-"
name: &name "Yitian Jin"
description: &description "Yitian Jin's academic homepage: robot learning, embodied AI, and geometric deep learning."
url: "https://yj244-jyt.github.io"
baseurl: ""
repository: "yj244-jyt/yj244-jyt.github.io"

# Sidebar profile
author:
  avatar: "profile.jpg"
  name: "Yitian Jin"
  bio: "Research intern working on embodied AI and robot learning."
  bio_zh: "具身智能与机器人学习方向研究实习生。"
  location: "Shanghai, China"
  location_zh: "中国上海"
  employer: "Noematrix"
  employer_zh: "穹彻智能（Noematrix）"
  employer_url: "https://www.noematrix.ai/en"
  email: "yj244@duke.edu"
  github: "yj244-jyt"

# Site behavior
breadcrumbs: false
words_per_minute: 160
future: false
read_more: "disabled"
comments:
  provider:
atom_feed:
  hide: true
analytics:
  provider: "false"

# Search and social metadata
og_image: "profile.jpg"
og_description: "Academic homepage of Yitian Jin, focused on robot learning, embodied AI, and geometric deep learning."
social:
  type: "Person"
  name: "Yitian Jin"
  links:
    - "https://github.com/yj244-jyt"

# Build inputs
include:
  - _pages
exclude:
  - "*.sublime-project"
  - "*.sublime-workspace"
  - .asset-cache
  - .bundle
  - .github
  - .jekyll-assets-cache
  - .sass-cache
  - assets/js/_main.js
  - assets/js/plugins
  - assets/js/vendor
  - CHANGELOG
  - Dockerfile
  - Gemfile
  - LICENSE
  - node_modules
  - package.json
  - README.md
  - tmp
  - vendor
keep_files:
  - .git
encoding: "utf-8"
markdown_ext: "markdown,mkdown,mkdn,mkd,md"

# Markdown
markdown: kramdown
highlighter: rouge
lsi: false
incremental: false
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo

# Page defaults
defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: true

sass:
  sass_dir: _sass
  style: compressed

permalink: /:categories/:title/
timezone: Asia/Shanghai

plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-redirect-from

whitelist:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-redirect-from

compress_html:
  clippings: all
  ignore:
    envs: development
